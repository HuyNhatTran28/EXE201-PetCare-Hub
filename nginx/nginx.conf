# File này được COPY vào /etc/nginx/conf.d/default.conf trong image Nginx
# (thay thế default.conf mặc định của image nginx:alpine — không cần khai báo
# lại http{}/worker_processes vì đã có sẵn trong nginx.conf gốc của image).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — bắt buộc để React Router hoạt động khi F5 ở route con
    # (vd /partner/dashboard). Thiếu dòng này thì F5 trang con sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — path thật của toàn bộ controller là "/api/**" (không có
    # path "/auth" trần nào cả, AuthController cũng nằm dưới "/api/auth").
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP/SockJS) — cần đủ header Upgrade/Connection,
    # thiếu là chat real-time chết dù API vẫn chạy bình thường.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Google OAuth2 — 2 endpoint nội bộ của Spring Security, KHÔNG nằm
    # dưới "/api". FE gọi "/oauth2/authorization/google" để bắt đầu đăng
    # nhập Google; Google redirect callback về "/login/oauth2/code/google".
    # Thiếu 2 location này thì đăng nhập Google vỡ hoàn toàn ở production
    # (request rơi vào SPA fallback ở trên, trả về index.html thay vì
    # được backend xử lý).
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI — tuỳ chọn, xoá 3 location dưới nếu muốn ẩn ở production
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
