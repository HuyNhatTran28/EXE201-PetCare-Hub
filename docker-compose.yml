services:
  db:
    # postgis/postgis (không phải postgres thường) — app dùng PostGIS cho
    # tìm khách sạn gần/theo tuyến đường (ST_DWithin, hotels/nearby,
    # search-along-route). Thiếu extension postgis thì BE lỗi khi chạy
    # native query. Tag khớp với "docker compose up -d db" ghi trong CLAUDE.md.
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petcare_hub}
      POSTGRES_USER: ${POSTGRES_USER:-petcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petcare123}
    volumes:
      # Named volume — dữ liệu DB không mất khi restart/xoá container,
      # chỉ mất khi chạy "docker compose down -v" (xoá cả volume).
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petcare} -d ${POSTGRES_DB:-petcare_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-petcare_hub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-petcare}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-petcare123}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}

      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_BACKEND_BASE_URL: ${APP_BACKEND_BASE_URL}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

      EKYC_TOKEN_ID: ${EKYC_TOKEN_ID}
      EKYC_TOKEN_KEY: ${EKYC_TOKEN_KEY}
      EKYC_ACCESS_TOKEN: ${EKYC_ACCESS_TOKEN}

      DDL_AUTO: ${DDL_AUTO:-update}
    expose:
      # Chỉ mở nội bộ trong Docker network — Nginx (cùng network) gọi được
      # qua tên service "backend:8080" là đủ, không cần publish ra host.
      # Cần gọi trực tiếp BE từ máy host để debug (vd Postman) thì tạm
      # thêm khối "ports: - '8080:8080'" vào đây.
      - "8080"

  nginx:
    build:
      # LƯU Ý: context = "." (gốc repo), không phải "./FE/petcare-hub-fe" —
      # vì Dockerfile FE cần copy cả nginx/nginx.conf nằm ở gốc repo.
      context: .
      dockerfile: FE/petcare-hub-fe/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
