spring.application.name=PetCare_Hub
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petcare_hub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petcare}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:petcare123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:petcare-hub-secret-key-must-be-at-least-32-characters-long}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

logging.level.org.springframework.web=INFO
logging.level.com.petcare_hub=INFO

spring.autoconfigure.exclude=\
  org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,\
  org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# URL gốc của Frontend (dùng cho redirect sau thanh toán payOS)
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Thuế VAT đang áp dụng (8% theo chính sách giảm thuế đến hết 31/12/2026; sau đó đổi về 0.10)
app.vat-rate=0.08

# OAuth2 cho Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Gmail SMTP settings
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Groq API — chatbot tư vấn (OpenAI-compatible)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
app.chat.daily-limit=1000

# VNPT eKYC Configs
ekyc.base-url=${EKYC_BASE_URL:https://api.idg.vnpt.vn}
ekyc.token-id=${EKYC_TOKEN_ID:}
ekyc.token-key=${EKYC_TOKEN_KEY:}
ekyc.access-token=${EKYC_ACCESS_TOKEN:}
ekyc.mac-address=${EKYC_MAC_ADDRESS:TEST1}
ekyc.face-match-threshold=${EKYC_FACE_MATCH_THRESHOLD:80}
