spring.application.name=PetCare_Hub
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/petcare_hub
spring.datasource.username=petcare
spring.datasource.password=petcare123
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

jwt.secret=petcare-hub-secret-key-must-be-at-least-32-characters-long
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

logging.level.org.springframework.web=DEBUG
logging.level.com.petcare_hub=DEBUG

spring.autoconfigure.exclude=
  org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,
  org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# URL gốc của Frontend (dùng cho redirect sau thanh toán payOS)
frontend.base-url=http://localhost:5173

# Thuế VAT đang áp dụng (8% theo chính sách giảm thuế đến hết 31/12/2026; sau đó đổi về 0.10)
app.vat-rate=0.08


#OAuth2 cho Google
spring.security.oauth2.client.registration.google.client-id=your-google-client-id
spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# SendGrid
sendgrid.api-key=your-sendgrid-api-key
sendgrid.from-email=info@petcarehub.com
sendgrid.from-name=PetCare Hub

#Cloundinary
cloudinary.cloud-name=your-cloudinary-cloud-name
cloudinary.api-key=your-cloudinary-api-key
cloudinary.api-secret=your-cloudinary-api-secret

#Gmail SMTP settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail-username
spring.mail.password=your-gmail-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# VNPT eKYC Configs
ekyc.base-url=https://api.idg.vnpt.vn
ekyc.token-id=your-ekyc-token-id
ekyc.token-key=your-ekyc-token-key
ekyc.access-token=your-ekyc-access-token
ekyc.mac-address=TEST1
ekyc.face-match-threshold=80

