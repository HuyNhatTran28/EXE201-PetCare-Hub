# ── Test profile — tất cả external services dùng dummy (không gửi email/gọi API thật) ──
# DB thật: integration test cần PostgreSQL thật (localhost:5432/petcare_hub)
spring.datasource.url=jdbc:postgresql://localhost:5432/petcare_hub
spring.datasource.username=petcare
spring.datasource.password=petcare123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (giữ nguyên để JwtUtils hoạt động)
jwt.secret=petcare-hub-secret-key-must-be-at-least-32-characters-long
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# SendGrid — dummy (AsyncEmailService bị @MockBean, bean này chỉ cần khởi tạo được)
sendgrid.api-key=SG.test-integration-dummy-key-for-context-init
sendgrid.from-email=test@petcarehub.vn
sendgrid.from-name=PetCare Hub Test

# Gmail SMTP — dummy (không gọi thật vì AsyncEmailService bị @MockBean)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Google OAuth2 — dummy
spring.security.oauth2.client.registration.google.client-id=test-google-client-id.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Cloudinary — dummy
cloudinary.cloud-name=testcloud
cloudinary.api-key=123456789012345
cloudinary.api-secret=test-cloudinary-secret-12345

# PayOS — dummy (không gọi trong staff test)
payos.client-id=test-payos-client-id
payos.api-key=test-payos-api-key
payos.checksum-key=test-payos-checksum-key-must-be-32-chars-min

# eKYC — dummy
ekyc.base-url=http://localhost
ekyc.token-id=test-token-id
ekyc.token-key=test-token-key
ekyc.access-token=test-access-token
ekyc.mac-address=TEST1
ekyc.face-match-threshold=80

# Frontend URL
frontend.base-url=http://localhost:5173

# VAT
app.vat-rate=0.08

# Groq — dummy
groq.api.key=test-groq-api-key
groq.model=llama-3.3-70b-versatile
app.chat.daily-limit=1000

# Tắt Spring AI (giữ nguyên)
spring.autoconfigure.exclude=\
  org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,\
  org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

